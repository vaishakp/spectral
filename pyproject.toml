[tool.black]
line-length = 80

[tool.isort]
profile = "black"

[tool.pylint.'MESSAGES CONTROL']
max-line-length = 120
disable= "W0311"

[tool.flake8]
max-line-length = 120
ignore = ['E203']

[build-system]
requires = ["hatchling", "hatch-requirements-txt"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "spectools/__init__.py"


[project]
name = "spectools"
dynamic = ['dependencies', 'optional-dependencies', 'version']
authors = [{ name="Vaishak Prasad", email="vaishakprasad@gmail.com"}, ]
description = " Numerical implementation of various spectral methods "
readme = "README.md"
requires-python = ">=3.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[tool.hatch.metadata.hooks.requirements_txt]
files = ["requirements.txt"]

[tool.hatch.metadata.hooks.requirements_txt.optional-dependencies]
opt = ["optional-requirements.txt"]
# spectools.spherical and spectools.interpolation need these; the
# import-light paths (chebyshev, fourier) do not. Kept OUT of the runtime
# requirements because waveformtools -> lalsuite and sxstools -> scri ->
# spinsfast have no Windows wheels, which made the whole package
# uninstallable there for Chebyshev-only users.
spherical = ["spherical-requirements.txt"]
docs = ["docs-requirements.txt"]

[project.urls]
"Homepage" = "https://github.com/vaishakp/spectral"
"Documentation" = "https://spectools.readthedocs.io/en/latest/"
"Bug Tracker" = "https://github.com/vaishakp/spectral/issues"

[tool.hatch.metadata]
allow-direct-references = true
